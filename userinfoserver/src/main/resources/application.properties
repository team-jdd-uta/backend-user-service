spring.application.name=userinfoserver
server.port=${SERVER_PORT:8084}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/commentdb}
mybatis.mapper-locations=classpath:db/mapper/*.xml

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/app_target?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:app_target}
spring.datasource.password=${DB_PASSWORD:app_target1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.consumer.enabled=${KAFKA_CONSUMER_ENABLED:true}
app.kafka.topics.user-registered=${USER_REGISTERED_TOPIC:outbox.event.user}
room.service.base-url=${ROOM_SERVICE_BASE_URL:http://localhost:8082}


spring.datasource.shard2.url=${DB_URL_SHARD2:jdbc:mariadb://localhost:3309/app_target?useUnicode=true&characterEncoding=utf8}
spring.datasource.shard2.username=${DB_USER_SHARD2:app_target}
spring.datasource.shard2.password=${DB_PASSWORD_SHARD2:app_target1234}
