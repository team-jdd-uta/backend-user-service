spring.application.name=userinfoserver
server.port=8084
mybatis.mapper-locations=classpath:db/mapper/*.xml

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/app_target?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER:app_target}
spring.datasource.password=${DB_PASSWORD:app_target1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.consumer.enabled=${KAFKA_CONSUMER_ENABLED:true}
app.kafka.topics.user-registered=${USER_REGISTERED_TOPIC:outbox.event.user}
